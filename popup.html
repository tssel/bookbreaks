<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BookBreaks</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">BOOKBREAKS</p>
      <h1>Earn your screen time.</h1>
      <p class="intro">Read first. Every minute you finish unlocks one minute of YouTube video time.</p>

      <section class="card">
        <div class="timer" id="timer">25:00</div>
        <label for="duration">Session length</label>
        <div class="duration-row">
          <input id="duration" type="number" min="1" max="120" value="25">
          <span>minutes</span>
        </div>
        <div class="actions">
          <button class="primary" id="start">Start reading</button>
          <button class="secondary" id="pause" hidden>Pause</button>
          <button class="secondary" id="stop">Stop and earn time</button>
        </div>
      </section>

      <section class="balance">
        <span>Available video time</span>
        <strong id="earned">0:00</strong>
      </section>
      <p class="status" id="status">YouTube video links are locked until you earn time.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
